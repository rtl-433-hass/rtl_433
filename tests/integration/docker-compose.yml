# Containerized integration & screenshot harness for the rtl_433 HA integration.
#
# Three services on a private bridge network:
#
#   rtl433  - the pinned hertzg/rtl_433 image. Replays a real .cu8 capture from
#             the rtl_433_tests submodule through a named-pipe FIFO so the single
#             rtl_433 process stays alive and decodes events continuously
#             (FIFO keep-alive, see rtl433-entrypoint.sh + Clarification #13). It
#             writes decoded events as JSON lines to a shared volume.
#
#   wsbridge- a small Node service (pinned node image) that tails the shared
#             JSON-lines file and re-broadcasts each event on ws://0.0.0.0:8433/ws
#             — the endpoint HA's coordinator expects. This exists because
#             rtl_433's native `-F http` /ws server does NOT broadcast when
#             reading from a file/FIFO (test-mode bypasses the HTTP event loop;
#             see README "Known limitation"). The FIFO replay is unchanged; only
#             the transport to HA is the bridge instead of native -F http.
#
#   homeassistant - the pinned Home Assistant core image with this repo's custom
#             integration bind-mounted into /config/custom_components. HA reaches
#             the stream at ws://wsbridge:8433/ws (compose DNS name).
#
# Images are pinned as `tag@sha256:digest`. The digest is what actually gets
# pulled, so the pin stays immutable; the tag is there so Renovate can see a
# version to compare against -- a bare `@sha256:` gives its docker-compose
# manager nothing to resolve, and the dependency goes unmanaged. renovate.json
# also has to un-ignore this path: config:recommended pulls in
# :ignoreModulesAndTests, whose ignorePaths cover `**/tests/**`.
# Bring-up MUST be backgrounded and polled (Clarification #14); see run-harness.sh.

services:
  rtl433:
    # rtl_433 25.12. The tag has since been rebuilt onto a newer Alpine base, so
    # it no longer resolves to this digest; the digest is the build every capture
    # fixture and screenshot in this repo was decoded by, and Renovate will offer
    # the rebuild as a digest update.
    image: hertzg/rtl_433:25.12@sha256:bcfd12afa59efc1ae8316ac21757b5e4161d4a42baaa91f609b4bcca9525dcfd
    container_name: rtl433_harness
    entrypoint: ["/bin/sh", "/opt/rtl433-entrypoint.sh"]
    environment:
      # Acurite-592TXR decodes as "Acurite-Tower": temperature_C + humidity +
      # battery_ok — exercises a temp sensor (degC/measurement) and a battery
      # binary_sensor in HA. The capture is sampled at 250k.
      CAPTURE: /data/acurite-592txr-003.cu8
      RATE: 250k
      EVENTS_FILE: /shared/events.jsonl
      # rtl_433's own log output. Decoded-event JSON carries no log messages, so
      # this file is the only source of the "Auto Level" noise lines behind the
      # receiver's noise sensors; the bridge tails it (see ws-bridge.mjs).
      LOG_FILE: /shared/rtl433.log
      NOISE_SECS: "10"
      FIFO: /tmp/rtl.fifo
      LOOP_SLEEP: "1"
    volumes:
      - ./rtl433-entrypoint.sh:/opt/rtl433-entrypoint.sh:ro
      - ./rtl_433_tests/tests/acurite/Acurite_592TXR:/data:ro
      - shared:/shared
    networks:
      - rtl433net
    restart: "no"

  wsbridge:
    # node:22-alpine (digest resolved 2026-05-25, linux/arm64).
    image: node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
    container_name: wsbridge_harness
    working_dir: /app
    command: ["node", "/app/ws-bridge.mjs"]
    environment:
      WS_PORT: "8433"
      EVENTS_FILE: /shared/events.jsonl
      # rtl_433's log output, re-framed as the structured log frames a real
      # `-F http` server pushes to WebSocket clients (receiver noise sensors).
      LOG_FILE: /shared/rtl433.log
      # Replay project fixtures alongside the live Acurite capture so the
      # screenshot harness sees a doorbell event entity, an energy meter, a
      # SCMplus gas meter (for the calibration step, which needs a device whose
      # MeterType the picker can detect), and door/leak sensors. See ws-bridge.mjs.
      FIXTURE_DIR: /fixtures
      FIXTURE_FILES: "doorbell_event.json,power_sensor.json,contact_leak.json,utility_meter.json"
    volumes:
      - ./ws-bridge.mjs:/app/ws-bridge.mjs:ro
      # Reuse the installed ws module from the host node_modules.
      - ./node_modules:/app/node_modules:ro
      # Project-authored JSON fixtures, replayed for the richer screenshots.
      - ../fixtures:/fixtures:ro
      - shared:/shared:ro
    ports:
      # Exposed on the host too for debugging the WS with ws-probe.mjs.
      - "8433:8433"
    depends_on:
      - rtl433
    networks:
      - rtl433net
    restart: "no"

  homeassistant:
    # This tag tracks the `homeassistant` key in hacs.json exactly -- it is the
    # oldest Home Assistant we claim to support, so it is the one worth running
    # against: on a newer release the harness would pass while the integration
    # was quietly broken for everyone sitting on the minimum. Renovate is
    # deliberately not allowed to bump it (see renovate.json); it moves when the
    # hacs.json floor moves, and tests/test_harness_pins.py fails if the two
    # drift apart.
    #
    # The floor is real rather than nominal: the integration calls APIs that do
    # not exist before it (device_registry.async_get_device_by_identifier,
    # adopted in #241), and the previous 2026.5.4 pin sat below it -- so the
    # config entry raised AttributeError on setup and every panel screenshot
    # silently skipped. Multi-arch index digest (resolved on linux/amd64), so it
    # pulls on either architecture.
    image: ghcr.io/home-assistant/home-assistant:2026.9.0@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293
    container_name: ha_harness
    volumes:
      - ../../custom_components/rtl_433:/config/custom_components/rtl_433:ro
      - ./ha-config/configuration.yaml:/config/configuration.yaml:ro
    ports:
      - "8123:8123"
    depends_on:
      - wsbridge
    networks:
      - rtl433net
    restart: "no"

networks:
  rtl433net:
    driver: bridge

volumes:
  shared:
