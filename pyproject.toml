# Custom Component pyproject.toml based on Home Assistant Core
# https://github.com/home-assistant/core/blob/dev/pyproject.toml
#
# Sections not included (HA Core specific):
# - [build-system] - Not published to PyPI (installed via HACS)
# - [tool.pylint.*] - Optional additional linting (Ruff is sufficient)

[project]
name = "rtl_433"
version = "0.20.1"   # Version is managed by release-please (also updates manifest.json)
description = "Home Assistant custom integration for the rtl_433 WebSocket API"
requires-python = ">=3.14"

# Test dependencies, declared so `uv run pytest tests/` bootstraps itself in a
# fresh clone or git worktree. Without this the project resolves to an empty
# virtual environment and `uv run pytest` fails with "Failed to spawn: pytest"
# while still exiting 0 -- a silent false pass. The group is named `dev` because
# uv installs that group by default; a differently-named group would need an
# explicit `--group` and would not fix the bare command.
#
# Keep these pins identical to requirements_test.txt, which CI and pip users
# still install directly. A renovate packageRule groups the two into one PR so
# they cannot drift apart (the same guard already used for ruff).
[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",
    "pyrtl_433==0.3.0",
    "mutmut==3.7.0",
]

[tool.uv]
# Resolve the lock only for the interpreters the test stack can actually run on.
# `requires-python` above stays at >=3.14 because that is what the *integration*
# needs (and it is the renovate-tracked Home Assistant Python requirement), but
# the pinned test stack pulls in a homeassistant that requires >=3.14.2, so an
# unrestricted resolution is unsatisfiable for 3.14.0/3.14.1. Constraining the
# environment here keeps the project's declared support honest instead of
# overstating it to satisfy a dev-only dependency.
environments = ["python_full_version >= '3.14.2'"]

[tool.setuptools]
packages = ["custom_components.rtl_433"]

[tool.pyright]
include = ["custom_components/rtl_433"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/.github",
    "**/docs",
    "**/venv",
    "**/.venv",
    "**/config",
]
typeCheckingMode = "basic"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnusedCoroutine = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "config"]
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_debug = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# -n auto runs the suite across all CPUs via pytest-xdist (~80s -> ~18s on 8
# cores). The tests share no mutable state, so distribution order is free.
# Override with `-n0` for a serial run: xdist costs ~4s of per-worker interpreter
# and Home Assistant import startup, which dominates a single-file selection, and
# it is incompatible with `--pdb` and `-s`. [tool.mutmut] pins `-n0` for the same
# reason -- see the comment there.
addopts = "-ra -q --strict-markers -n auto"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use coordinator/time service)",
]
filterwarnings = [
    # Treat warnings as errors to catch issues early
    "error",
    # Ignore specific warnings from third-party libraries as needed
    # "ignore:.*custom_components.* is using deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/rtl_433"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
target-version = "py314"
line-length = 88
# Ruff 0.16.0 formats Python code blocks in Markdown by default. The Strikethroo
# plan and task documents are frozen records whose fenced blocks are illustrative
# sketches, not source: hand-aligned comment columns and deliberately compact
# definitions that the formatter would rewrite. Exclude them from both the linter
# and the formatter; they contain no Python files.
# extend-exclude, not exclude: plain `exclude` would replace ruff's built-in
# defaults (.git, .venv, __pycache__, ...) rather than add to them.
extend-exclude = [".ai"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by the formatter)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is fine in tests
    "PLR2004", # Magic values are fine in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mutmut]
# Mutation testing config (mutmut 3.x). mutmut copies source_paths plus the
# auto-included tests/ + pyproject.toml into a mutants/ working copy and runs the
# pytest suite there, forking once per mutant. The whole package must be in scope
# so intra-package imports resolve inside mutants/.
source_paths = ["custom_components/rtl_433/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Cancel the `-n auto` in [tool.pytest.ini_options].addopts, which the copied
# pyproject.toml would otherwise apply to every mutant. mutmut already forks one
# process per mutant, so xdist would nest a worker pool inside each of them; it
# also calls pytest.main() with an in-process results plugin, and under xdist the
# tests run in worker subprocesses where that plugin never sees them. mutmut
# appends these args last, so `-n0` wins over addopts.
pytest_add_cli_args = ["-n0"]
# custom_components/ has no __init__.py (namespace package); copy it only if present.
also_copy = ["custom_components/__init__.py"]

# Shared mutation CI tooling (https://github.com/rtl-433-hass/mutmut-ratchet).
# These are the per-repo constants the deleted ``scripts/mutation_*.py`` helpers
# used to hard-code: everything else (the tolerance band, the baseline/timings
# paths) keeps the tool's defaults, which are the values those scripts used.
[tool.mutmut_ratchet]
package_path = "custom_components/rtl_433"
# Changes to these escalate a scoped PR run to a full one: they can move results
# package-wide, so scoping to the diff would not be sound.
escalate_paths = [
    "pyproject.toml",
    "requirements_test.txt",
    "tests/conftest.py",
    ".github/workflows/mutation.yml",
]

# Tests whose filename does not map 1:1 to a source module via the
# ``test[_mut]_<name>.py`` -> ``<name>.py`` convention, declared with the modules
# they actually exercise so a PR touching them scopes instead of escalating.
# Covers compound tests (``test_diagnostics_repairs`` -> diagnostics + repairs),
# the ``coordinator`` package root, and the ``__init__`` root (the resolver
# cannot reach ``__init__.py`` — there is no ``init.py``).
#
# Genuinely broad integration tests (``test_lifecycle.py`` drives the whole
# config-entry setup across __init__, entity, and every platform) are
# intentionally absent so they still escalate — a full run is correct when they
# change. Values are module paths under ``custom_components/rtl_433/``. An entry
# that under-specifies a test's modules is caught by the push-to-main + nightly
# FULL runs (which re-verify the entire baseline), so it is a delayed catch,
# never a silent floor blind spot.
[tool.mutmut_ratchet.explicit_test_sources]
"tests/test_coordinator.py" = ["coordinator/base.py"]
"tests/test_mut_init.py" = ["__init__.py", "migration.py", "hub_settings.py"]
"tests/test_config_flow.py" = ["config_flow.py", "options_flow.py"]
"tests/test_mut_config_flow.py" = ["config_flow.py", "options_flow.py"]
"tests/test_binary_sensor_motion.py" = ["binary_sensor.py", "event.py"]
"tests/test_event_trace.py" = ["event.py"]
"tests/test_diagnostics_repairs.py" = ["diagnostics.py", "repairs.py"]
"tests/test_sdr_controls.py" = [
    "number.py",
    "select.py",
    "switch.py",
    "sdr_settings.py",
]
# The sdr_settings HA adapter mapping (``test_sdr_settings_adapter`` does not
# auto-resolve to a source module via the naming convention).
"tests/test_sdr_settings_adapter.py" = ["sdr_settings.py"]
# The fixture mapping-coverage sweep: data-driven, and everything it exercises in
# code (library loading plus descriptor resolution) now lives in
# ``pyrtl_433.library``, which mutmut does not mutate. Mapped to an empty list so
# touching it scopes to *no* source rather than escalating to a full run; the
# library's own mutation gate lives in the pyrtl_433 repository.
"tests/test_fixture_coverage.py" = []
# Mutation-floor test files: their ``_floor`` suffix does not auto-resolve to a
# source module via the naming convention, so each is mapped explicitly.
"tests/test_mut_calibration_floor.py" = ["calibration.py"]
"tests/test_mut_library_floor.py" = ["library.py"]
"tests/test_mut_migration_floor.py" = ["migration.py"]
# End-to-end migration round-trip identity tests: exercise the migration ladder
# (``async_migrate_entry``) against seeded registries; the ``_roundtrip`` suffix
# does not auto-resolve to a module.
"tests/test_migration_roundtrip.py" = ["migration.py"]
"tests/test_mut_repairs_floor.py" = ["repairs.py"]
# The connection-backed availability gate: the coordinator half (the outage
# clock, the gate itself, the repaint dispatch) plus every entity type that reads
# it. ``hub_availability`` has no module of its own to auto-resolve to.
"tests/test_hub_availability.py" = [
    "coordinator/_watchdog.py",
    "coordinator/base.py",
    "entity.py",
    "sensor.py",
    "event.py",
    "diagnostics.py",
]
