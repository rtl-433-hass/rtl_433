name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  pytest:
    # The job name is the status-check context required by the main branch
    # ruleset ("pytest (Python 3.14)"), so it must not drift. The matrix value
    # only labels the check here; the interpreter comes from .python-version.
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Python version comes from .python-version (tracks the Home Assistant
      # requirement); uv reads it automatically.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install requirements
        run: |
          uv venv
          uv pip install -r requirements_test.txt

      - name: Run tests
        run: uv run pytest --cov=custom_components/rtl_433 tests/
