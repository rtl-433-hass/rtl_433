name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

concurrency:
  # Supersede a PR's in-flight run when the branch is pushed to again: those
  # results are already stale, and on a busy day they are what the new run
  # queues behind. Keyed by ref, so separate PRs never block each other.
  # Non-PR triggers (push to main, the nightly) key on the unique run id
  # instead, so they neither cancel nor serialize behind one another -- those
  # are the runs that keep the branch honest.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # The job name is the status-check context required by the main branch
    # ruleset ("pytest (Python 3.14)"), so it must not drift. The matrix value
    # only labels the check here; the interpreter comes from .python-version.
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Python version comes from .python-version (tracks the Home Assistant
      # requirement); uv reads it automatically.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install requirements
        run: |
          uv venv
          uv pip install -r requirements_test.txt

      - name: Run tests
        run: uv run pytest --cov=custom_components/rtl_433 tests/

  frontend:
    # The panel is one hand-written ES module with no build step, so this runs
    # Node's own test runner over it: no dependencies to install, nothing to
    # compile, and the tests import the shipped file itself rather than a copy.
    name: "frontend (node --test)"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/frontend/*.test.mjs
