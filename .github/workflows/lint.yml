name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

concurrency:
  # Supersede a PR's in-flight run when the branch is pushed to again: those
  # results are already stale, and on a busy day they are what the new run
  # queues behind. Keyed by ref, so separate PRs never block each other.
  # Non-PR triggers (push to main, the nightly) key on the unique run id
  # instead, so they neither cancel nor serialize behind one another -- those
  # are the runs that keep the branch honest.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Bare `uvx ruff` floats to the newest release on every run, so a ruff
      # release can turn this job red on an unchanged commit. Read the version
      # from requirements_dev.txt so there is a single Renovate-managed pin.
      - name: Resolve pinned Ruff version
        id: ruff
        run: |
          version="$(grep -oP '^ruff==\K.*' requirements_dev.txt)"
          if [ -z "$version" ]; then
            echo "::error::No 'ruff==' pin found in requirements_dev.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ruff lint check
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff@${RUFF_VERSION}" check .

      - name: Ruff format check
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff@${RUFF_VERSION}" format --check .

  pre-commit:
    name: "pre-commit"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python version comes from .python-version (tracks the Home Assistant
      # requirement); uv reads it automatically.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
