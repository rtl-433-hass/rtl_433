name: Release Credits

# release-please's changelog links commits, never the people who wrote them, so
# a community pull request ships in the release notes anonymously and its author
# is never notified. After each Release run this appends an "@username" credits
# block to the open release PR naming every contributor who is not a maintainer
# (see scripts/release_credits.py for how "maintainer" is decided).
#
# It hangs off workflow_run rather than pull_request because the release PR only
# ever changes as a result of the Release workflow: that is exactly when the
# block needs recomputing, it re-runs even when release-please rewrites the body
# without touching the branch, and it keeps this job off fork PR events, where
# GITHUB_TOKEN is read-only.
#
# The block is marker-delimited and rewritten in place, so repeated runs replace
# it instead of stacking copies, and an unchanged body is not written at all (a
# no-op PATCH could re-notify the mentioned contributors).
#
# workflow_run only fires for the copy of this file on the default branch, so it
# starts working once merged to main; use the workflow_dispatch trigger (with an
# optional PR number) to run it by hand.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to update (default: the open release PR)"
        required: false
        type: string

permissions: {}

# Two Release runs can finish close together; serialize so they cannot race on
# the same PR body. Never cancel: the last run is the one that leaves the body
# correct.
concurrency:
  group: release-credits
  cancel-in-progress: false

jobs:
  credits:
    name: Credit outside contributors
    # A failed Release run leaves the release PR untouched, so there is nothing
    # to recompute.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script authenticates with GITHUB_TOKEN below; git needs no
          # credentials of its own here.
          persist-credentials: false

      # The script is stdlib-only, so the runner's preinstalled python3 is
      # enough: no uv bootstrap, no dependency install.
      - name: Update release PR credits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Read through the environment rather than interpolated into the run
          # block, so the input cannot be expanded as shell.
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PR_NUMBER:-}" ]; then
            args+=(--pr "${PR_NUMBER}")
          fi
          python3 scripts/release_credits.py ${args[@]+"${args[@]}"}
